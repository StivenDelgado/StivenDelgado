<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="ABOUT">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa" stop-opacity=".9"/><stop offset=".6" stop-color="#2563eb" stop-opacity=".35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <style>
    .dot{animation:p 2.8s ease-in-out infinite}
    @keyframes p{50%{opacity:.25}}
    .sweep{animation:s 5s cubic-bezier(.6,0,.4,1) infinite}
    @keyframes s{from{transform:translateX(0)}to{transform:translateX(900px)}}
  </style>
  <text x="0" y="58" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="16" fill="#a78bfa" letter-spacing="2">01</text>
  <text x="44" y="60" font-family="'Inter','Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="7" fill="#8b8fb8">ABOUT</text>
  <circle class="dot" cx="223" cy="47" r="4" fill="#22d3ee"/>
  <g transform="translate(245 0)">
    <rect y="46" width="785" height="1.5" fill="url(#ln)"/>
    <rect class="sweep" y="44" width="80" height="6" rx="3" fill="#22d3ee" opacity=".7" filter="url(#g)"/>
  </g>
  <text x="1200" y="52" text-anchor="end" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#8b8fb8" letter-spacing="1">// who i am</text>
</svg>
