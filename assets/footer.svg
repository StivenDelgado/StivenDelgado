      <text x="600" y="110" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="4" fill="#a78bfa">LET'S BUILD SOMETHING THAT SCALES</text>
