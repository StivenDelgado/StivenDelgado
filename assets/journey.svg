  @keyframes tw{from{opacity:.15}to{opacity:.9}}
  .b{animation:drift ease-in-out infinite alternate}
  @keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
</style>
